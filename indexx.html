<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="main">
        <div id="header">
            <div class="top-header">
                <div class="menu">
                    <ul>
                        <li><a href="trangchu.html" class="active">Trang chủ</a></li>
                        <li><a href="banhngot.html">Bánh Ngọt</a></li>
                        <li><a href="banhkem.html">Bánh Kem</a></li>
                        <li><a href="banhbao.html">Bánh Bao</a></li>
                        <li><a href="lienhe.html">Liên Hệ</a></li>
                    </ul>
                </div>
                <div class="search">
                    <form action="">
                        <input type="text" placeholder="Tìm kiếm..." required>
                        <button type="submit">Tìm kiếm</button>
                    </form>
                </div>
            </div>

            <div class="logo">
                <canvas id="myCanvas" width="400" height="120"></canvas>
            </div>

            <div class="banner">
                <img src="./image/banner.jpg" alt="Banner Lễ Hội Mùa Hè">
            </div>
        </div>

        <div id="content">
            <h1>Ưu Đãi Dành Riêng Cho Bạn</h1>
            <div class="products">
                <div class="item">
                    <img src="./image/anh_1.png" alt="Freeze Trà Xanh">
                    <h2>Freeze Trà Xanh</h2>
                    <p>25.000đ <del>35.000đ</del></p>
                </div>
                <div class="item">
                    <img src="./image/anh_2.png" alt="Cà phê phin Highlands">
                    <h2>Cà phê </h2>
                    <p>29.000đ <del>37.000đ</del></p>
                </div>
                <div class="item">
                    <img src="./image/anh_3.png" alt="Trà Thạch Đào">
                    <h2>Trà Thạch Đào</h2>
                    <p>25.000đ <del>35.000đ</del></p>
                </div>
                <div class="item">
                    <img src="./image/anh_4.png" alt="Trà Thạch Vải">
                    <h2>Trà Thạch Vải</h2>
                    <p>25.000đ <del>35.000đ</del></p>
                </div>
            </div>
        </div>

        <div id="footer">
            <h1>Copyright © 2024 Design by Mạnh Duy</h1>
        </div>
    </div>

    <script>
        var canvas = document.getElementById('myCanvas');
        var context = canvas.getContext('2d');
        var centerX = canvas.width / 2;
        var centerY = canvas.height / 2;
        var radiusX = 75;
        var radiusY = 30;

        context.beginPath();
        context.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, 2 * Math.PI);
        context.fillStyle = '#faacac';
        context.fill();
        context.closePath();

        var textWater = 'water';
        context.font = '20px sans-serif';
        context.fillStyle = 'black';
        context.textAlign = 'center';
        var textWaterWidth = context.measureText(textWater).width;
        context.fillText(textWater, centerX - textWaterWidth / 2 + 5, centerY + 6);

        var textLove = 'love';
        context.fillStyle = 'white';
        context.fillText(textLove, centerX + 32, centerY + 6);
    </script>
</body>

</html>
